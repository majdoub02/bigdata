# Pipeline CSV : /data/inbox/*.csv -> Elasticsearch (logs-security-YYYY.MM.dd)
input {
  file {
    path => "/data/inbox/*.csv"
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_csv"
    discover_interval => 2
    stat_interval => "1 second"
    tags => ["csv"]
  }
}

filter {
  # La ligne brute arrive dans "message" : on la déplace pour ne pas
  # écraser la colonne "message" du CSV.
  mutate { rename => { "message" => "raw_line" } }

  csv {
    source => "raw_line"
    separator => ","
    skip_header => true
    columns => ["timestamp","source_ip","username","event_type","status","level",
                "service","message","user_agent","attack_type","resource"]
  }

  if "_csvparsefailure" not in [tags] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }

    # Supprime les champs vides (ex : attack_type pour un évènement normal)
    ruby {
      code => "event.to_hash.each { |k, v| event.remove(k) if v.is_a?(String) && v.strip.empty? }"
    }

    mutate {
      strip => ["source_ip", "username", "event_type", "status", "level", "service"]
      lowercase => ["event_type", "status", "service"]
      uppercase => ["level"]
      add_tag => ["security"]
    }

    # file_id = nom du fichier sans extension (ex : f_20261030_001)
    grok {
      match => { "[log][file][path]" => "(?<file_id>[^/]+)\.csv$" }
      tag_on_failure => []
    }

    # Géolocalisation de l'IP source (ajoute geoip.country_name, geoip.location, ...)
    if [source_ip] {
      geoip {
        source => "source_ip"
        target => "geoip"
        tag_on_failure => ["_geoip_lookup_failure"]
      }
    }

    if "_dateparsefailure" not in [tags] {
      mutate { remove_field => ["timestamp"] }
    }
  }

  mutate { remove_field => ["raw_line", "@version", "host", "event"] }
}

output {
  if "_csvparsefailure" in [tags] or "_dateparsefailure" in [tags] {
    # Erreurs de parsing : écrites dans data/errors pour analyse
    file {
      path => "/data/errors/csv-failures-%{+YYYY-MM-dd}.jsonl"
      codec => json_lines
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-security-%{+YYYY.MM.dd}"
    }
  }
  # Décommenter pour déboguer :
  # stdout { codec => rubydebug }
}
