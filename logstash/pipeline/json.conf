# Pipeline JSON : /data/inbox/*.json (une ligne = un objet JSON, format NDJSON)
input {
  file {
    path => ["/data/inbox/*.json", "/data/inbox/*.jsonl"]
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_json"
    discover_interval => 2
    stat_interval => "1 second"
    codec => "json"
    tags => ["json"]
  }
}

filter {
  if "_jsonparsefailure" not in [tags] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }

    ruby {
      code => "event.to_hash.each { |k, v| event.remove(k) if v.is_a?(String) && v.strip.empty? }"
    }

    mutate {
      strip => ["source_ip", "username", "event_type", "status", "level", "service"]
      lowercase => ["event_type", "status", "service"]
      uppercase => ["level"]
      add_tag => ["security"]
    }

    grok {
      match => { "[log][file][path]" => "(?<file_id>[^/]+)\.jsonl?$" }
      tag_on_failure => []
    }

    if [source_ip] {
      geoip {
        source => "source_ip"
        target => "geoip"
        tag_on_failure => ["_geoip_lookup_failure"]
      }
    }

    if "_dateparsefailure" not in [tags] {
      mutate { remove_field => ["timestamp"] }
    }
  }

  mutate { remove_field => ["@version", "host", "event"] }
}

output {
  if "_jsonparsefailure" in [tags] or "_dateparsefailure" in [tags] {
    file {
      path => "/data/errors/json-failures-%{+YYYY-MM-dd}.jsonl"
      codec => json_lines
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "logs-security-%{+YYYY.MM.dd}"
    }
  }
}
